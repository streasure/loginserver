belong: "default"
serverType: "LoginServer"
zone: "default"
serverId: "loginserver-1"

ports:
  httpAddr: 10001
  grpcServiceAddr: 10002
  pprofPort: 10003

# Redis 实例表：键为实例名（业务侧通过 uredis.GetClient(name) 取用，rmodel 固定使用 "rdb"），支持多实例扩展
redis:
  rdb:
    network: tcp
    address: "127.0.0.1:6379"
    db: 1
    password: ""

# Redis 命令读写超时（秒），对所有实例生效
readTimeoutSec: 3
writeTimeoutSec: 3
RedisMinIdleConns: 0  # redis的最小idle连接数
RedisMaxIdleConns: 40 # redis的最大idle连接数
RedisMaxOpenConns: 40 # redis的最大open连接数
RedisMaxIdleTime: 300s # redis连接的最大idle时间
RedisMaxLifeTime: 3600s # redis连接的最大生命周期，需要根据redis的timeout来设置

etcd:
  endpoints: ["http://127.0.0.1:2379"]
  servicePrefix: "/services"
  leaseTTL: "10s"

limits:
  loginTokenExpireSeconds: 86400
  validateTokenCacheTtl: "1s"   # token 校验的进程内缓存窗口，0s 禁用；token 撤销生效延迟上界为该值

# 运行时性能调优（进程启动时应用一次）
perf:
  gcPercent: 300        # GOGC 等效值（默认 100），本机压测 300 时吞吐最优
  memoryLimitPercent: 90   # 软内存上限 = 机器总内存 × 该百分比（0-100），0 = 不限制；跨机器部署免修改
