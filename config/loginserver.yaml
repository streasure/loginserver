belong: "default"
serverType: "LoginServer"
zone: "default"
serverId: "loginserver-1"

ports:
  httpAddr: 10001
  grpcServiceAddr: 10002
  pprofPort: 10003

# Redis 实例表：键为实例名（业务侧通过 uredis.GetClient(name) 取用，rmodel 固定使用 "rdb"），支持多实例扩展
redis:
  rdb:
    network: tcp
    address: "127.0.0.1:6379"
    db: 1
    password: ""

# Redis 命令读写超时（秒），对所有实例生效
readTimeoutSec: 3
writeTimeoutSec: 3
RedisMinIdleConns: 0  # redis的最小idle连接数
RedisMaxIdleConns: 40 # redis的最大idle连接数
RedisMaxOpenConns: 40 # redis的最大open连接数
RedisMaxIdleTime: 300s # redis连接的最大idle时间
RedisMaxLifeTime: 3600s # redis连接的最大生命周期，需要根据redis的timeout来设置

etcd:
  endpoints: ["http://127.0.0.1:2379"]
  servicePrefix: "/services"
  leaseTTL: "10s"

limits:
  loginTokenExpireSeconds: 86400
  validateTokenCacheTtl: "1s"   # token 校验的进程内缓存窗口，0s 禁用；token 撤销生效延迟上界为该值

# 运行时性能调优（进程启动时应用一次）
perf:
  gcPercent: 300        # GOGC 等效值（默认 100），本机压测 300 时吞吐最优
  memoryLimitPercent: 90   # 软内存上限 = 机器总内存 × 该百分比（0-100），0 = 不限制；跨机器部署免修改

# 自适应准入控制（uload 组件）：按整机 CPU/内存边界值自动对 HTTP/gRPC 限流/熔断，
# ugin/ugrpc 拦截链自动生效，业务无感知；全 0 边界时组件惰性不生效
load:
  cpuLimit: 85        # CPU 软边界(%)：越界持续 sustain 按超限比例丢弃请求（限流+降级），0=不启用
  memLimit: 90        # 内存软边界(%)，0=不启用
  cpuReject: 97       # CPU 硬边界(%)：越界持续 sustain 全部拒绝（熔断），须大于 cpuLimit，0=不启用
  memReject: 97       # 内存硬边界(%)，须大于 memLimit，0=不启用
  # interval: 2s      # 采样间隔（默认 2s）
  # sustain: 3s       # 越界需持续的时长，默认 3s（防抖，避免瞬时尖峰触发）
  # cooldown: 10s     # 熔断后最短拒绝时长（默认 10s），到期后按最新采样恢复
  # release: 5        # 恢复回差(%)：低于边界-release 才恢复（默认 5，防抖）
  # apiAddr: ":10004" # 负载状态查询接口监听地址（可选），GET /internal/load 返回状态 JSON
  # apiPath: "/internal/load"
