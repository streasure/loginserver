belong: "default"
serverType: "LoginServer"
zone: "default"
serverId: "loginserver-1"

RedisReadTimeoutSec: 3
RedisWriteTimeoutSec: 3

ports:
  httpAddr: 10001
  grpcServiceAddr: 10002
  pprofPort: 10003

redis:
  address: "127.0.0.1:6379"
  db: 1
  network: tcp
  password: ""

etcd:
  endpoint: "http://127.0.0.1:2379"
  servicePrefix: "/services"
  leaseTTL: "10s"

limits:
  loginTokenExpireSeconds: 86400
  validateTokenCacheTtl: "1s"   # token 校验的进程内缓存窗口，0s 禁用；token 撤销生效延迟上界为该值

# 运行时性能调优（进程启动时应用一次）
perf:
  gcPercent: 300        # GOGC 等效值（默认 100），本机压测 300 时吞吐最优
  memoryLimitPercent: 80   # 软内存上限 = 机器总内存 × 该百分比（0-100），0 = 不限制；跨机器部署免修改

serverList:
  clientGetServerListUrl: "http://localhost:10001/api/v1/server/list"
  serverInfos:
    - serverId: 1
      serverName: "测试服务器1"
      serverUrl: "ws://127.0.0.1:8001"
      serverStatus: 0
    - serverId: 2
      serverName: "测试服务器2"
      serverUrl: "ws://127.0.0.1:8002"
      serverStatus: 0
