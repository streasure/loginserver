belong: "default"
serverType: "LoginServer"
zone: "default"
serverId: "loginserver-1"

ports:
  httpAddr: 10001
  grpcServiceAddr: 10002
  pprofPort: 10003

redis:
  address: "127.0.0.1:6379"
  db: 1
  network: tcp
  password: ""
  readTimeoutSec: 3
  writeTimeoutSec: 3

etcd:
  endpoints: ["http://127.0.0.1:2379"]
  servicePrefix: "/services"
  leaseTTL: "10s"

limits:
  loginTokenExpireSeconds: 86400
  validateTokenCacheTtl: "1s"   # token 校验的进程内缓存窗口，0s 禁用；token 撤销生效延迟上界为该值

# 运行时性能调优（进程启动时应用一次）
perf:
  gcPercent: 300        # GOGC 等效值（默认 100），本机压测 300 时吞吐最优
  memoryLimitPercent: 80   # 软内存上限 = 机器总内存 × 该百分比（0-100），0 = 不限制；跨机器部署免修改
