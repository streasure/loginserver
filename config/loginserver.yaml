belong: "default"
serverType: "LoginServer"
zone: "default"
serverId: "loginserver-1"

ports:
  httpAddr: 10001
  grpcServiceAddr: 10002
  pprofPort: 10003

# Redis 配置：连接池/超时参数 + 实例表（键为实例名，业务侧通过 uredis.GetClient(name)
# 取用，rmodel 固定使用 "rdb"），整体由 uredis.Init 一行接入组件；
# 时长为空串、数值为 0 表示沿用 uredis 默认值（不显式覆盖）
redis:
  readTimeout: 3s      # 命令读超时
  writeTimeout: 3s     # 命令写超时
  # dialTimeout: 3s    # 建连超时（默认 3s）
  # poolTimeout: 3s    # 从连接池取连接的超时（默认 3s）
  # minIdleConns: 0    # 最小空闲连接数（默认 10×CPU）
  maxIdleConns: 40     # 最大空闲连接数
  poolSize: 40         # 最大 open 连接数（对应 go-redis PoolSize）
  maxIdleTime: 300s    # 连接最大空闲时间，需小于 redis server 的 timeout
  maxLifeTime: 3600s   # 连接最大生命周期，需根据 redis server 的 timeout 设置
  instances:
    rdb:
      network: tcp
      address: "127.0.0.1:6379"
      db: 1
      password: ""

etcd:
  endpoints: ["http://127.0.0.1:2379"]
  servicePrefix: "/services"
  leaseTTL: "10s"

limits:
  loginTokenExpireSeconds: 86400
  validateTokenCacheTtl: "1s"   # token 校验的进程内缓存窗口，0s 禁用；token 撤销生效延迟上界为该值

# 运行时性能调优（进程启动时应用一次）
perf:
  gcPercent: 300        # GOGC 等效值（默认 100），本机压测 300 时吞吐最优
  memoryLimitPercent: 90   # 软内存上限 = 机器总内存 × 该百分比（0-100），0 = 不限制；跨机器部署免修改

# 自适应准入控制（uload）：按整机 CPU/内存边界值自动对 HTTP/gRPC 限流/熔断，
# 随 ugin.WithLoad 接入，拦截链自动生效，业务无感知；全 0 边界时惰性不生效
load:
  cpuLimit: 85        # CPU 软边界(%)：越界持续 sustain 按超限比例丢弃请求（限流+降级），0=不启用
  memLimit: 90        # 内存软边界(%)，0=不启用
  cpuReject: 97       # CPU 硬边界(%)：越界持续 sustain 全部拒绝（熔断），须大于 cpuLimit，0=不启用
  memReject: 97       # 内存硬边界(%)，须大于 memLimit，0=不启用
  # interval: 2s      # 采样间隔（默认 2s）
  # sustain: 3s       # 越界需持续的时长，默认 3s（防抖，避免瞬时尖峰触发）
  # cooldown: 10s     # 熔断后最短拒绝时长（默认 10s），到期后按最新采样恢复
  # release: 5        # 恢复回差(%)：低于边界-release 才恢复（默认 5，防抖）
  # apiAddr: ":10004" # 负载状态查询接口监听地址（可选），GET /internal/load 返回状态 JSON
  # apiPath: "/internal/load"

# 业务数据库（白/黑名单、封禁角色、服务器列表）：形态对齐 ugorm.Config，
# 建库建表脚本见 sql/，组件由 ugorm.NewComponent(&conf.Db) 接入
db:
  configs:
    logindb:
      dbname: "loginserver"
      host: "127.0.0.1"
      port: 3306
      uid: "root"
      pwd: "root"
  maxIdleConns: 10
  maxOpenConns: 50
  maxIdleSeconds: 3600
  maxLifeSeconds: 28800

# ACL 黑白名单/封禁角色：缓存版本号（gen）token 与管理接口配置
acl:
  cacheTtl: 5m          # 缓存条目 TTL（redis 数据丢失/写失败时脏数据兜底上界）
  genRefresh: 2s        # 本地版本快照刷新周期（跨节点缓存脏数据窗口上界）
  adminToken: "loginserver-admin"   # 管理接口鉴权：请求头 X-Admin-Token 期望值
  trustedProxies: []    # 信任的反代 IP/CIDR（防 X-Forwarded-For 伪造）；直连部署保持空，反代后配置如 ["10.0.0.0/8"]

# loginserver → sgate Kick 联动（单向 Kick 模型：封禁落库后下发踢人 RPC）
sgate:
  internalToken: "loginserver-sgate-internal"  # 与 sgate kickInternalToken 保持一致
