# 压测专用日志配置：仅输出 error 级日志，去掉每请求 Info 写盘，测量极限性能
log:
  level: error
  format: json
  async:
    enabled: true
    worker_multiplier: 1
    buffer_size: 100000
    batch_size: 1000
    flush_interval: 100
  console:
    enabled: false
  file:
    enabled: true
    path: ./logs/loginserver.log
    rotate:
      max_size: 100
      max_backups: 10
      max_age: 30
      interval: 0
  stacktrace:
    enabled: true
    level: error
    depth: 10
  sampling:
    enabled: true
    tick: 1
    initial: 20
    thereafter: 100
  performance:
    lock_free: true
    use_pool: true
    prealloc: true
